name: motionai
description: MotionAI - professional motion video editor with 2D/3D camera, parallax and an AI editing agent.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4
  video_player: ^2.14.1
  file_picker: ^13.3.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
