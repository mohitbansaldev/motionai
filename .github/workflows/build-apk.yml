# Builds the Android app on GitHub's servers, so nothing has to run on your PC.
# Every push to main (or a manual "Run workflow") produces a downloadable APK.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Adds any missing Android project files (never overwrites existing ones).
      - run: flutter create --org com.mohitflix --project-name motionai --platforms=android .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: motionai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
