name: motionai
description: MotionAI - professional motion video editor with 2D/3D camera, parallax and an AI editing agent.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4
  video_player: ^2.14.1
  file_picker: ^13.3.0
  path_provider: ^2.1.4
  http: ^1.2.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  whisper_ggml: ^2.10.0
  flutter_secure_storage: '>=9.2.0 <12.0.0'
  # Windows desktop (agent A): video preview, drag & drop, FFI, pure-Dart images.
  video_player_win: ^3.3.0
  desktop_drop: '>=0.6.0 <0.9.0' # 0.9 needs cross_file 0.4 (conflicts with file_picker 13)
  ffi: ^2.1.0
  image: ^4.2.0
  # win-43: Flow panel (Google Flow inside the app, WebView2)
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # CHROMA (Agent M): green screen keyer (lib/ui/preview/fx/chroma_key.dart)
  shaders:
    - shaders/chroma_key.frag
  assets:
    - assets/world_countries.json
    # V3-A: dark satellite map base (NASA Blue Marble, public domain; ocean graded dark teal)
    - assets/maps/blue_marble_dark.jpg
    # FONTS (Agent I): font licences (shown from the font picker)
    - assets/fonts/anton/OFL.txt
    - assets/fonts/bebasneue/OFL.txt
    - assets/fonts/oswald/OFL.txt
    - assets/fonts/teko/OFL.txt
    - assets/fonts/barlowcondensed/OFL.txt
    - assets/fonts/playfairdisplay/OFL.txt
    - assets/fonts/dmserifdisplay/OFL.txt
    - assets/fonts/cinzel/OFL.txt
    - assets/fonts/greatvibes/OFL.txt
    - assets/fonts/dancingscript/OFL.txt
    - assets/fonts/permanentmarker/LICENSE.txt
    - assets/fonts/specialelite/LICENSE.txt
    - assets/fonts/robotomono/OFL.txt
    - assets/fonts/inter/OFL.txt
    - assets/fonts/montserrat/OFL.txt
    - assets/fonts/poppins/OFL.txt
    - assets/fonts/notosansdevanagari/OFL.txt
    - assets/fonts/hind/OFL.txt
    - assets/fonts/mukta/OFL.txt
    - assets/fonts/baloo2/OFL.txt
    - assets/fonts/rozhaone/OFL.txt
    - assets/fonts/yatraone/OFL.txt
    - assets/fonts/kalam/OFL.txt
    # V3-C >>> data/HUD fonts (OFL, github.com/google/fonts)
    - assets/fonts/sharetechmono/OFL.txt
    - assets/fonts/comicneue/OFL.txt
    # <<< V3-C
