name: motionai
description: MotionAI - professional motion video editor with 2D/3D camera, parallax and an AI editing agent.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4
  video_player: ^2.14.1
  file_picker: ^13.3.0
  path_provider: ^2.1.4
  http: ^1.2.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  flutter_secure_storage: '>=9.2.0 <12.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/world_countries.json
