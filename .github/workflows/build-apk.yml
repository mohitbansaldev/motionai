# Builds the Android app on GitHub's servers, so nothing has to run on your PC.
# Every push to main (or a manual "Run workflow") produces a downloadable APK.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Adds any missing Android project files (never overwrites existing ones).
      - run: flutter create --org com.mohitflix --project-name motionai --platforms=android .
      - name: Android permissions
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $f || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $f
          grep -q 'mlkit.vision.DEPENDENCIES' $f || sed -i 's#</application>#    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="subject_segment"/>\n    </application>#' $f
          grep -q 'android:scheme="https"' $f || sed -i 's#<application#<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application#' $f
          g=android/app/build.gradle.kts
          grep -q 'mlkit-subject-segmentation' $g || printf '\ndependencies {\n    implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")\n}\n' >> $g
          # On-device Whisper and ML Kit need Android 7.0+ (API 24).
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' $g
          grep -n "minSdk" $g || true
          cat $f
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Permanent signing key (repo secret) so updates install over the old app.
      - name: Signing key
        env:
          KEY: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p ~/.android
            echo "$KEY" | base64 -d > ~/.android/debug.keystore
            echo "Using the permanent signing key"
          else
            echo "No SIGNING_KEYSTORE_B64 secret yet: random key (uninstall needed between builds)"
          fi
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MotionAI.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk MotionAI-older-phones.apk
          ls -la *.apk

      # Publishes the APK on the Releases page: one-tap download on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MotionAI build ${{ github.run_number }}
          body: |
            Install **MotionAI.apk** (most phones from the last ~7 years).
            Only if it says "app not compatible", use MotionAI-older-phones.apk.
          files: |
            MotionAI.apk
            MotionAI-older-phones.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: motionai-apk
          path: MotionAI.apk
