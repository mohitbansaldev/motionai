# Builds the Windows desktop app on GitHub's servers: MotionAI-Setup.exe
# (installer) + a portable zip, published as release "win-N".
# The release is NOT marked latest: the Android in-app updater reads
# releases/latest, the Windows updater looks for the newest "win-*" tag.
name: Build Windows

on:
  push:
    branches: [main, feat/windows, integ/v1, integ/v2, integ/v3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      REL: build\windows\x64\runner\Release
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Adds any missing platform files (never overwrites existing ones).
      - run: flutter create --org com.mohitflix --project-name motionai --platforms=windows,android .

      - name: Window title, size and product name
        shell: pwsh
        run: |
          $f = 'windows/runner/main.cpp'
          $s = Get-Content $f -Raw
          $s = $s -replace 'Win32Window::Size size\(\d+, \d+\)', 'Win32Window::Size size(1440, 900)'
          $s = $s -replace 'window\.Create\(L"motionai"', 'window.Create(L"MotionAI"'
          # win-30: ask hybrid laptops (NVIDIA Optimus / AMD Switchable) for the
          # dedicated GPU, so the preview and export run on it, not the iGPU.
          if ($s -notmatch 'NvOptimusEnablement') {
            $s = $s + "`r`n`r`n// MotionAI: prefer the high-performance GPU on hybrid laptops.`r`nextern `"C`" {`r`n  __declspec(dllexport) unsigned long NvOptimusEnablement = 0x00000001;`r`n  __declspec(dllexport) int AmdPowerXpressRequestHighPerformance = 1;`r`n}`r`n"
          }
          Set-Content $f $s -NoNewline
          Select-String -Path $f -Pattern 'Size size|window.Create|NvOptimusEnablement'
          $rc = 'windows/runner/Runner.rc'
          if (Test-Path $rc) {
            (Get-Content $rc -Raw) -replace '"motionai"', '"MotionAI"' | Set-Content $rc -NoNewline
          }

      # win-43: webview_windows (Flow panel) uses /await; the newest MSVC refuses
      # it unless this define is set for every target.
      - name: Allow webview_windows on new MSVC
        shell: pwsh
        run: |
          $f = 'windows/CMakeLists.txt'
          $s = Get-Content $f -Raw
          if ($s -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
            $s = $s -replace '(project\([^\)]*\))', "`$1`r`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
            Set-Content $f $s -NoNewline
          }
          Select-String -Path $f -Pattern 'project\(|_SILENCE_EXPERIMENTAL'

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      # FFmpeg/FFprobe (GPL build with NVENC, QSV and AMF encoders) next to the exe.
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $urls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile ffmpeg.zip; $ok = $true; Write-Host "Using $u"; break } catch { Write-Host "Not available: $u" }
          }
          if (-not $ok) { throw 'Could not download FFmpeg' }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x -Force
          $bin = Get-ChildItem ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName $env:REL
          Copy-Item (Join-Path $bin.DirectoryName 'ffprobe.exe') $env:REL
          & "$env:REL\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          & "$env:REL\ffmpeg.exe" -hide_banner -encoders | Select-String 'h264_|libx264'
          # Smoke test: the exact RGBA-pipe encode the app does (CPU encoder; runners have no GPU).
          & "$env:REL\ffmpeg.exe" -hide_banner -loglevel error -f lavfi -i color=c=red:s=320x240:r=30:d=1 -f rawvideo -pix_fmt rgba frames.rgba
          & "$env:REL\ffmpeg.exe" -y -hide_banner -loglevel error -f rawvideo -pix_fmt rgba -s 320x240 -framerate 30 -i frames.rgba -an -vf "scale=out_color_matrix=bt709:out_range=tv,format=yuv420p" -c:v libx264 -preset medium -crf 18 smoke.mp4
          if (-not (Test-Path smoke.mp4)) { throw 'FFmpeg smoke test failed' }
          # win-30: a second, older FFmpeg in "ffmpeg_compat\" for NVENC on older
          # NVIDIA drivers (FFmpeg 8 needs driver 570+, 7.1 works from 551,
          # 6.1 from 531). The app tries it only when the main one's NVENC fails.
          $curls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n6.1-latest-win64-gpl-6.1.zip'
          )
          foreach ($u in $curls) {
            try {
              Invoke-WebRequest $u -OutFile ffmpeg_compat.zip
              Expand-Archive ffmpeg_compat.zip -DestinationPath ffc_x -Force
              $cb = Get-ChildItem ffc_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              $cdest = Join-Path $env:REL 'ffmpeg_compat'
              New-Item -ItemType Directory -Force $cdest | Out-Null
              Copy-Item $cb.FullName $cdest
              Write-Host "Compat FFmpeg: $u"
              & (Join-Path $cdest 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1
              break
            } catch { Write-Host "Not available: $u" }
          }

      # --- WINAI BINARIES ---
      # Agent E (feat/winai) owns this step's contents (Windows AI layer,
      # lib/platform/windows_ai): whisper.cpp CLI in a "whisper" sub-folder
      # (speech-to-text) and onnxruntime.dll next to the exe (photo cut-out).
      # Models are downloaded by the app on first use, not bundled.
      - name: Bundle Windows AI binaries (whisper.cpp, ONNX Runtime)
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $wurls = @(
            'https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip',
            'https://github.com/ggml-org/whisper.cpp/releases/download/v1.7.6/whisper-bin-x64.zip'
          )
          $ok = $false
          foreach ($u in $wurls) {
            try { Invoke-WebRequest $u -OutFile whisper.zip; $ok = $true; Write-Host "Using $u"; break } catch { Write-Host "Not available: $u" }
          }
          if (-not $ok) { throw 'Could not download whisper.cpp' }
          Expand-Archive whisper.zip -DestinationPath whisper_x -Force
          $cli = Get-ChildItem whisper_x -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) { $cli = Get-ChildItem whisper_x -Recurse -Filter main.exe | Select-Object -First 1 }
          $dest = Join-Path $env:REL 'whisper'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $cli.FullName (Join-Path $dest 'whisper-cli.exe')
          Get-ChildItem $cli.DirectoryName -Filter *.dll | Copy-Item -Destination $dest
          Get-ChildItem $dest
          & (Join-Path $dest 'whisper-cli.exe') --help 2>&1 | Select-Object -First 3

          # ONNX Runtime (CPU) from the official PyPI wheel, else NuGet, else GitHub.
          $ortVer = '1.22.0'
          $dll = $null
          try {
            python -m pip download "onnxruntime==$ortVer" --no-deps --only-binary=:all: --platform win_amd64 --python-version 3.12 -d ort_whl
            $whl = Get-ChildItem ort_whl -Filter *.whl | Select-Object -First 1
            Copy-Item $whl.FullName ort_whl.zip
            Expand-Archive ort_whl.zip -DestinationPath ort_x -Force
            $dll = Get-ChildItem ort_x -Recurse -Filter onnxruntime.dll | Select-Object -First 1
            if ($dll) { Write-Host "ONNX Runtime $ortVer from PyPI" }
          } catch { Write-Host "PyPI wheel not available: $_" }
          if (-not $dll) {
            try {
              Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/$ortVer" -OutFile ort_nuget.zip
              Expand-Archive ort_nuget.zip -DestinationPath ort_n -Force
              $dll = Get-ChildItem 'ort_n\runtimes\win-x64\native' -Filter onnxruntime.dll | Select-Object -First 1
              if ($dll) { Write-Host "ONNX Runtime $ortVer from NuGet" }
            } catch { Write-Host "NuGet package not available: $_" }
          }
          if (-not $dll) {
            Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$ortVer/onnxruntime-win-x64-$ortVer.zip" -OutFile ort.zip
            Expand-Archive ort.zip -DestinationPath ort_g -Force
            $dll = Get-ChildItem ort_g -Recurse -Filter onnxruntime.dll | Select-Object -First 1
            if ($dll) { Write-Host "ONNX Runtime $ortVer from GitHub" }
          }
          if (-not $dll) { throw 'Could not get onnxruntime.dll' }
          Copy-Item $dll.FullName $env:REL
          $shared = Join-Path $dll.DirectoryName 'onnxruntime_providers_shared.dll'
          if (Test-Path $shared) { Copy-Item $shared $env:REL }
          Get-Item (Join-Path $env:REL 'onnxruntime.dll') | Format-List Name, Length, VersionInfo

      # Runs the real engines once (cut-out model, Windows voice → whisper
      # words) and checks the model download URLs. Informational only.
      - name: Windows AI smoke test
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force winai_models | Out-Null
          Invoke-WebRequest 'https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx' -OutFile winai_models\u2netp.onnx
          Invoke-WebRequest 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin' -OutFile winai_models\ggml-tiny.bin
          Write-Host "u2netp.onnx $((Get-Item winai_models\u2netp.onnx).Length) sha256 $((Get-FileHash winai_models\u2netp.onnx -Algorithm SHA256).Hash)"
          Write-Host "ggml-tiny.bin $((Get-Item winai_models\ggml-tiny.bin).Length) sha1 $((Get-FileHash winai_models\ggml-tiny.bin -Algorithm SHA1).Hash)"
          foreach ($m in 'base', 'small') {
            try {
              $r = Invoke-WebRequest -Method Head "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$m.bin"
              Write-Host "ggml-$m.bin length $($r.Headers['Content-Length'])"
            } catch { Write-Warning "ggml-$m.bin not reachable: $_" }
          }
          $env:WINAI_IT = '1'
          $env:WINAI_ORT = (Resolve-Path "$env:REL\onnxruntime.dll").Path
          $env:WINAI_U2NETP = (Resolve-Path winai_models\u2netp.onnx).Path
          $env:WINAI_WHISPER = (Resolve-Path "$env:REL\whisper\whisper-cli.exe").Path
          $env:WINAI_WHISPER_MODEL = (Resolve-Path winai_models\ggml-tiny.bin).Path
          flutter test test/winai_test.dart --plain-name "windows integration" -r expanded
          if ($LASTEXITCODE -ne 0) { throw 'Windows AI smoke test failed' }
      # --- END WINAI BINARIES ---

      # Visual C++ runtime next to the exe, so it starts on PCs without it.
      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" $env:REL
          }
          Get-ChildItem $env:REL | Format-Table Name, Length

      # --- MCP BRIDGE (Agent P) ---
      # motionai-mcp.exe next to motionai.exe: the stdio MCP server that Claude
      # Desktop starts. It forwards to the running app's localhost server
      # (lib/remote/, tool/motionai_mcp.dart). The installer packs it with
      # the rest of the Release folder.
      - name: Build Claude MCP bridge (motionai-mcp.exe)
        shell: pwsh
        run: |
          dart compile exe tool/motionai_mcp.dart -o "$env:REL\motionai-mcp.exe"
          if ($LASTEXITCODE -ne 0) { throw 'dart compile exe failed' }
          # Smoke test over stdio: initialize + tools/list are answered without starting the app.
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $list = '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $out = @($init, '{"jsonrpc":"2.0","method":"notifications/initialized"}', $list) | & "$env:REL\motionai-mcp.exe" --control "$env:RUNNER_TEMP\no-mcp.json"
          $out | ForEach-Object { Write-Host ($_.Substring(0, [Math]::Min(200, $_.Length))) }
          $lines = @($out | Where-Object { $_.Trim() -ne '' })
          if ($lines.Count -ne 2) { throw "Expected 2 JSON-RPC lines on stdout, got $($lines.Count)" }
          $msgs = @($lines | ForEach-Object { $_ | ConvertFrom-Json })
          $r1 = $msgs | Where-Object { $_.id -eq 1 }
          $r2 = $msgs | Where-Object { $_.id -eq 2 }
          if ($r1.result.protocolVersion -ne '2025-06-18') { throw 'initialize failed' }
          if ($r2.result.tools.Count -lt 25) { throw "tools/list returned $($r2.result.tools.Count) tools" }
          Write-Host "MCP bridge OK: $($r2.result.tools.Count) tools"
      # --- END MCP BRIDGE (Agent P) ---

      - name: Installer and portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=0.5.${{ github.run_number }}" "/DSourceDir=$PWD\$env:REL" "/DOutDir=$PWD" installer\motionai.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          Compress-Archive -Path "$env:REL\*" -DestinationPath MotionAI-Windows-portable.zip -Force
          Get-ChildItem MotionAI-* | Format-Table Name, Length

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: win-${{ github.run_number }}
          name: MotionAI for Windows · build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            **Windows 10/11 (64-bit):** download and run **MotionAI-Setup.exe** (no admin needed).
            Or unzip MotionAI-Windows-portable.zip anywhere and run motionai.exe.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
          files: |
            MotionAI-Setup.exe
            MotionAI-Windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: motionai-windows
          path: MotionAI-Setup.exe
