# Fast checks for feature branches: analyze + tests, no release.
name: Check branch

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.mohitflix --project-name motionai --platforms=android,windows .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
